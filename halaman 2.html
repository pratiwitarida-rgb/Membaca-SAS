<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Menu Belajar - SAGA | 2 Kolom 3 Baris</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #b3e0ff 0%, #e6f7ff 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 120, 215, 0.2);
            overflow: hidden;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            margin: 20px 0;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(to right, #87ceeb, #b3e0ff, #87ceeb);
        }
        
        .header {
            margin-bottom: 40px;
            padding: 0 10px;
        }
        
        .logo {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
        }
        
        .logo i {
            font-size: 4rem;
            color: #87ceeb;
            background: linear-gradient(135deg, #2c7fb8, #87ceeb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 3px 5px rgba(135, 206, 235, 0.3));
        }
        
        h1 {
            color: #2c7fb8;
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .subtitle {
            color: #5a9bc6;
            font-size: 1.3rem;
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* ========== MENU GRID - 2 KOLOM & 3 BARIS ========== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);  /* Dua kolom tetap */
            gap: 30px;
            margin: 40px 0;
            padding: 0 10px;
        }
        
        /* Gaya tombol menu */
        .menu-btn {
            background: linear-gradient(135deg, #b3e0ff 0%, #e6f7ff 100%);
            border: none;
            border-radius: 15px;
            padding: 35px 20px;
            color: #2c7fb8;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(135, 206, 235, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            height: 100%;
            min-height: 220px;
            width: 100%;
        }
        
        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, #5a9bc6, #2c7fb8);
        }
        
        .menu-btn:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 25px rgba(135, 206, 235, 0.4);
        }
        
        .menu-btn:active {
            transform: translateY(-2px) scale(0.98);
        }
        
        .menu-btn.click-effect {
            animation: clickAnimation 0.3s ease;
        }
        
        @keyframes clickAnimation {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .menu-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #2c7fb8;
            transition: transform 0.3s ease;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .menu-btn:active .menu-icon {
            transform: scale(1.1);
        }
        
        .menu-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #2c7fb8;
            transition: transform 0.3s ease;
            line-height: 1.3;
            word-break: break-word;
        }
        
        .menu-btn:active .menu-title {
            transform: scale(1.05);
        }
        
        .menu-desc {
            font-size: 1rem;
            color: #5a9bc6;
            line-height: 1.5;
            max-width: 90%;
            margin: 0 auto;
            word-break: break-word;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            background: transparent;
            color: #5a9bc6;
            border: 2px solid #b3e0ff;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .back-btn:hover {
            background: #e6f7ff;
            color: #2c7fb8;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(135, 206, 235, 0.3);
        }
        
        .back-btn:active {
            transform: translateY(-1px) scale(0.98);
            background: #d6f0ff;
        }
        
        .back-btn i {
            margin-right: 10px;
            transition: transform 0.3s ease;
        }
        
        .back-btn:active i {
            transform: translateX(-3px);
        }
        
        /* Elemen dekorasi */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0.7;
            z-index: 0;
        }
        
        .cloud-1 {
            width: 150px;
            height: 50px;
            top: 10%;
            left: 5%;
            animation: float 20s infinite linear;
        }
        
        .cloud-2 {
            width: 200px;
            height: 70px;
            bottom: 15%;
            right: 5%;
            animation: float 25s infinite linear reverse;
        }
        
        .cloud-3 {
            width: 120px;
            height: 40px;
            top: 40%;
            right: 10%;
            animation: float 18s infinite linear;
        }
        
        .floating-books {
            position: absolute;
            font-size: 2rem;
            color: #87ceeb;
            opacity: 0.7;
            z-index: 0;
        }
        
        .book-1 {
            top: 15%;
            right: 8%;
            animation: float 15s infinite linear;
        }
        
        .book-2 {
            bottom: 20%;
            left: 8%;
            animation: float 18s infinite linear reverse;
        }
        
        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-15px) rotate(5deg);
            }
            100% {
                transform: translateY(0) rotate(0deg);
            }
        }
        
        /* ========== RESPONSIVE: TETAP 2 KOLOM 3 BARIS ========== */
        /* Tablet Landscape & Portrait - tetap 2 kolom */
        @media (min-width: 768px) and (max-width: 1024px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .menu-grid {
                gap: 25px;
                padding: 0 5px;
            }
            
            .menu-btn {
                padding: 30px 15px;
                min-height: 200px;
            }
            
            .menu-icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }
            
            .menu-title {
                font-size: 1.4rem;
            }
            
            .menu-desc {
                font-size: 0.95rem;
            }
        }
        
        /* Mobile devices: tetap 2 kolom dengan penyesuaian nyaman */
        @media (max-width: 767px) {
            body {
                padding: 15px;
                justify-content: flex-start;
                min-height: auto;
            }
            
            .container {
                padding: 25px 15px;
                margin: 10px 0;
                border-radius: 15px;
                width: 100%;
                max-width: 100%;
            }
            
            .header {
                margin-bottom: 30px;
                padding: 0;
            }
            
            .logo {
                margin-bottom: 15px;
                height: 60px;
            }
            
            .logo i {
                font-size: 3rem;
            }
            
            h1 {
                font-size: 1.8rem;
                margin-bottom: 10px;
                padding: 0 5px;
            }
            
            .subtitle {
                font-size: 1.1rem;
                padding: 0 5px;
            }
            
            /* Kunci: 2 kolom untuk mobile juga */
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
                margin: 30px 0;
                padding: 0;
            }
            
            .menu-btn {
                padding: 20px 12px;
                min-height: 180px;
                border-radius: 12px;
            }
            
            .menu-icon {
                font-size: 2.6rem;
                margin-bottom: 12px;
                height: 55px;
            }
            
            .menu-title {
                font-size: 1.25rem;
                margin-bottom: 8px;
            }
            
            .menu-desc {
                font-size: 0.85rem;
                max-width: 95%;
            }
            
            .back-btn {
                padding: 10px 25px;
                font-size: 1rem;
                margin-top: 25px;
            }
            
            .cloud-1, .cloud-2, .cloud-3 {
                display: none;
            }
            
            .floating-books {
                display: none;
            }
        }
        
        /* Smartphone kecil (480px ke bawah) - tetap 2 kolom, scaling rapi */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 20px 12px;
                border-radius: 12px;
            }
            
            .logo i {
                font-size: 2.5rem;
            }
            
            h1 {
                font-size: 1.6rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .menu-grid {
                gap: 15px;
                margin: 25px 0;
            }
            
            .menu-btn {
                padding: 16px 10px;
                min-height: 160px;
            }
            
            .menu-icon {
                font-size: 2.3rem;
                margin-bottom: 10px;
                height: 48px;
            }
            
            .menu-title {
                font-size: 1.15rem;
            }
            
            .menu-desc {
                font-size: 0.8rem;
                line-height: 1.4;
            }
            
            .back-btn {
                padding: 8px 20px;
                font-size: 0.95rem;
                margin-top: 20px;
            }
        }
        
        /* Perangkat sangat kecil (hingga 360px) - tetap 2 kolom, lebih hemat ruang */
        @media (max-width: 360px) {
            .container {
                padding: 18px 10px;
            }
            
            h1 {
                font-size: 1.4rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .menu-grid {
                gap: 12px;
            }
            
            .menu-btn {
                padding: 14px 8px;
                min-height: 145px;
            }
            
            .menu-icon {
                font-size: 2rem;
                margin-bottom: 8px;
                height: 42px;
            }
            
            .menu-title {
                font-size: 1rem;
                margin-bottom: 5px;
            }
            
            .menu-desc {
                font-size: 0.75rem;
            }
        }
        
        /* Layar desktop lebar - tetap 2 kolom agar sesuai permintaan */
        @media (min-width: 1400px) {
            .container {
                max-width: 1300px;
                padding: 50px 40px;
            }
            
            .menu-grid {
                gap: 35px;
                grid-template-columns: repeat(2, 1fr); /* Tetap dua kolom */
            }
            
            .menu-btn {
                padding: 40px 25px;
                min-height: 250px;
            }
            
            .menu-icon {
                font-size: 4rem;
                margin-bottom: 25px;
            }
            
            .menu-title {
                font-size: 1.6rem;
            }
            
            .menu-desc {
                font-size: 1.1rem;
            }
        }
        
        /* Landscape mode pada ponsel (tinggi terbatas) - tetap 2 kolom nyaman */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
                justify-content: flex-start;
            }
            
            .container {
                padding: 20px 15px;
                margin: 5px 0;
            }
            
            .header {
                margin-bottom: 20px;
            }
            
            .logo {
                margin-bottom: 10px;
                height: 50px;
            }
            
            .logo i {
                font-size: 2.5rem;
            }
            
            h1 {
                font-size: 1.6rem;
                margin-bottom: 8px;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                margin: 20px 0;
            }
            
            .menu-btn {
                padding: 16px 10px;
                min-height: 150px;
            }
            
            .menu-icon {
                font-size: 2.3rem;
                margin-bottom: 8px;
                height: 48px;
            }
            
            .menu-title {
                font-size: 1.2rem;
            }
            
            .menu-desc {
                font-size: 0.8rem;
            }
        }
        
        /* Mencegah teks terpotong di semua tombol */
        .menu-btn, .menu-title, .menu-desc {
            overflow-wrap: break-word;
            word-wrap: break-word;
            hyphens: auto;
        }
    </style>
</head>
<body>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    
    <div class="floating-books book-1">
        <i class="fas fa-book-open"></i>
    </div>
    <div class="floating-books book-2">
        <i class="fas fa-book"></i>
    </div>
    
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-book-reader"></i>
            </div>
            
            <h1>Menu Belajar</h1>
            <p class="subtitle">Pilih tingkat kesulitan yang ingin Anda pelajari</p>
        </div>
        
        <!-- MENU UTAMA: 2 KOLOM x 3 BARIS -->
        <div class="menu-grid">
            <!-- Baris 1 - Kolom 1: Cara Penggunaan -->
            <button class="menu-btn" id="cara-penggunaan-btn">
                <div class="menu-icon">
                    <i class="fas fa-question-circle"></i>
                </div>
                <div class="menu-title">Cara Penggunaan</div>
                <div class="menu-desc">Panduan lengkap menggunakan aplikasi SAGA</div>
            </button>
            
            <!-- Baris 1 - Kolom 2: CP & TP -->
            <button class="menu-btn" id="cp-tp-btn">
                <div class="menu-icon">
                    <i class="fas fa-clipboard-list"></i>
                </div>
                <div class="menu-title">CP & TP</div>
                <div class="menu-desc">Capaian Pembelajaran dan Tujuan Pembelajaran</div>
            </button>
            
            <!-- Baris 2 - Kolom 1: Huruf -->
            <button class="menu-btn" id="huruf-btn">
                <div class="menu-icon">
                    <i class="fas fa-font"></i>
                </div>
                <div class="menu-title">Huruf</div>
                <div class="menu-desc">Belajar mengenal huruf alfabet dari A sampai Z</div>
            </button>
            
            <!-- Baris 2 - Kolom 2: Suku Kata -->
            <button class="menu-btn" id="suku-kata-btn">
                <div class="menu-icon">
                    <i class="fas fa-text-height"></i>
                </div>
                <div class="menu-title">Suku Kata</div>
                <div class="menu-desc">Pelajari cara menggabungkan huruf menjadi suku kata</div>
            </button>
            
            <!-- Baris 3 - Kolom 1: Kata -->
            <button class="menu-btn" id="kata-btn">
                <div class="menu-icon">
                    <i class="fas fa-spell-check"></i>
                </div>
                <div class="menu-title">Kata</div>
                <div class="menu-desc">Bentuk kata dari berbagai suku kata yang berbeda</div>
            </button>
            
            <!-- Baris 3 - Kolom 2: Kalimat -->
            <button class="menu-btn" id="kalimat-btn">
                <div class="menu-icon">
                    <i class="fas fa-align-left"></i>
                </div>
                <div class="menu-title">Kalimat</div>
                <div class="menu-desc">Analisis struktur kalimat sederhana menggunakan metode SAS</div>
            </button>
        </div>
        
        <button class="back-btn" id="back-btn">
            <i class="fas fa-arrow-left"></i> Kembali
        </button>
    </div>

    <script>
        // Fungsi untuk efek klik + redirect (animasi halus)
        function addClickEffectAndRedirect(element, url) {
            // Tambah kelas animasi klik
            element.classList.add('click-effect');
            
            // Efek getaran tambahan pada ikon (opsional, terlihat lebih hidup)
            const icon = element.querySelector('.menu-icon i');
            if (icon) {
                icon.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    if (icon) icon.style.transform = '';
                }, 150);
            }
            
            // Redirect setelah animasi selesai (300ms sinkron dengan animasi)
            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }
        
        // Tombol Cara Penggunaan (halaman 9)
        const caraBtn = document.getElementById('cara-penggunaan-btn');
        if (caraBtn) {
            caraBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 9.html');
            });
        }
        
        // Tombol CP & TP (halaman 10)
        const cpTpBtn = document.getElementById('cp-tp-btn');
        if (cpTpBtn) {
            cpTpBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 10.html');
            });
        }
        
        // Tombol Huruf (halaman 3)
        const hurufBtn = document.getElementById('huruf-btn');
        if (hurufBtn) {
            hurufBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 3.html');
            });
        }
        
        // Tombol Suku Kata (halaman 4)
        const sukuKataBtn = document.getElementById('suku-kata-btn');
        if (sukuKataBtn) {
            sukuKataBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 4.html');
            });
        }
        
        // Tombol Kata (halaman 7)
        const kataBtn = document.getElementById('kata-btn');
        if (kataBtn) {
            kataBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 7.html');
            });
        }
        
        // Tombol Kalimat (halaman 8)
        const kalimatBtn = document.getElementById('kalimat-btn');
        if (kalimatBtn) {
            kalimatBtn.addEventListener('click', function(e) {
                e.preventDefault();
                addClickEffectAndRedirect(this, 'halaman 8.html');
            });
        }
        
        // Tombol Kembali (back)
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            backBtn.addEventListener('click', function(e) {
                e.preventDefault();
                // Efek skala untuk tombol kembali
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    window.history.back();
                }, 150);
                // Reset transform setelah redirect (tidak masalah karena halaman berubah)
                setTimeout(() => {
                    if (backBtn) backBtn.style.transform = '';
                }, 200);
            });
        }
        
        // Animasi kemunculan bertahap untuk setiap tombol (dengan urutan baru 2 kolom)
        document.addEventListener('DOMContentLoaded', function() {
            // Atur delay animasi untuk awan & buku dekoratif
            const clouds = document.querySelectorAll('.cloud');
            const books = document.querySelectorAll('.floating-books');
            
            clouds.forEach(cloud => {
                cloud.style.animationDelay = Math.random() * 5 + 's';
            });
            
            books.forEach(book => {
                book.style.animationDelay = Math.random() * 3 + 's';
            });
            
            // Efek fade-in bertahap untuk setiap menu (6 menu)
            const menuButtons = document.querySelectorAll('.menu-btn');
            menuButtons.forEach((button, index) => {
                button.style.opacity = '0';
                button.style.transform = 'translateY(20px)';
                button.style.transition = 'all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
                
                // Urutan kemunculan berdasarkan index (dari kiri ke kanan, baris demi baris)
                // Memberikan kesan dinamis namun tetap rapi
                setTimeout(() => {
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                }, 200 + (index * 100));
            });
            
            // Sempurnakan gaya transisi untuk tombol kembali juga
            if (backBtn) {
                backBtn.style.transition = 'all 0.2s ease';
            }
            
            // Penanganan khusus untuk sentuhan pada perangkat mobile (mencegah ghost click)
            const allButtons = document.querySelectorAll('.menu-btn, .back-btn');
            allButtons.forEach(btn => {
                btn.addEventListener('touchstart', function(e) {
                    // Hanya untuk memastikan responsivitas sentuhan, tidak mengganggu event click
                    this.style.cursor = 'pointer';
                });
            });
        });
        
        // Fallback untuk mencegah double navigation saat klik cepat (opsional)
        let isNavigating = false;
        const originalAddClickEffect = addClickEffectAndRedirect;
        window.addClickEffectAndRedirect = function(element, url) {
            if (isNavigating) return;
            isNavigating = true;
            originalAddClickEffect(element, url);
            setTimeout(() => {
                isNavigating = false;
            }, 500);
        };
        // Reassign fungsi ke tombol-tombol agar menggunakan navigasi guard
        // Update event listeners dengan fungsi terbaru (tetap aman)
        const updateGuard = () => {
            const caraBtnNew = document.getElementById('cara-penggunaan-btn');
            const cpTpBtnNew = document.getElementById('cp-tp-btn');
            const hurufBtnNew = document.getElementById('huruf-btn');
            const sukuKataBtnNew = document.getElementById('suku-kata-btn');
            const kataBtnNew = document.getElementById('kata-btn');
            const kalimatBtnNew = document.getElementById('kalimat-btn');
            
            const safeRedirect = (btn, url) => {
                if (btn) {
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    newBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (!isNavigating) {
                            isNavigating = true;
                            newBtn.classList.add('click-effect');
                            setTimeout(() => {
                                window.location.href = url;
                            }, 300);
                            setTimeout(() => { isNavigating = false; }, 500);
                        }
                    });
                    return newBtn;
                }
                return null;
            };
            
            safeRedirect(document.getElementById('cara-penggunaan-btn'), 'halaman 9.html');
            safeRedirect(document.getElementById('cp-tp-btn'), 'halaman 10.html');
            safeRedirect(document.getElementById('huruf-btn'), 'halaman 3.html');
            safeRedirect(document.getElementById('suku-kata-btn'), 'halaman 4.html');
            safeRedirect(document.getElementById('kata-btn'), 'halaman 7.html');
            safeRedirect(document.getElementById('kalimat-btn'), 'halaman 8.html');
        };
        // Opsional: tidak perlu mengganti karena navigasi guard sudah diintegrasikan di event asli
        // Namun kita bisa menimpa fungsi addClickEffectAndRedirect untuk aman.
        window.addClickEffectAndRedirect = function(element, url) {
            if (isNavigating) return;
            isNavigating = true;
            element.classList.add('click-effect');
            setTimeout(() => {
                window.location.href = url;
            }, 300);
            setTimeout(() => {
                isNavigating = false;
            }, 500);
        };
    </script>
</body>
